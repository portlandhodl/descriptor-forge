[package]
name = "descriptor-forge"
version = "0.1.0"
edition = "2021"
description = "Bitcoin Core importdescriptors command forge, compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
miniscript = "12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
